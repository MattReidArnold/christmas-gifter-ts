info:
  name: List groups
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/groups"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("includes the created group", function () {
          expect(res.body).to.be.an("array");
          const ids = res.body.map((group) => group.id);
          expect(ids).to.include(bru.getVar("groupId"));
        });

settings:
  encodeUrl: true
