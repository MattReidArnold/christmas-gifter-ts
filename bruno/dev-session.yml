info:
  name: Dev session
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/dev/session"
  body:
    type: json
    data: |-
      {
        "email": "dev@example.com",
        "name": "Dev User"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const header = res.headers["set-cookie"];
        const raw = Array.isArray(header) ? header : String(header ?? "").split(/,(?=[^;]+?=)/);
        const cookie = raw.map((value) => value.split(";")[0].trim()).filter(Boolean).join("; ");
        bru.setVar("sessionCookie", cookie);
        bru.setVar("userId", res.body.user.id);
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returns a user id", function () {
          expect(res.body.user.id).to.be.a("string");
        });

settings:
  encodeUrl: true
