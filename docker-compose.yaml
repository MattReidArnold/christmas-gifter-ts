services:
  server:
    build:
      context: ./server
      dockerfile: ./dev/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://devUser:Password123@mongo:27017/dev
      - PORT=4000
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: ./dev/Dockerfile
    depends_on:
      - server
    ports:
      - '3000:3000'
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - PROXY_HOST=server
      - PROXY_PORT=4000
    command: npm start

  mongo:
    image: mongo:9
    restart: always
    command: ['mongod', '--quiet']
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_DATABASE: dev
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: SuperSecret789
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  mongo-express:
    image: mongo-express:1
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:SuperSecret789@mongo:27017/

volumes:
  mongo-data:
